name: Build executable for Windows
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  release:
    types: [created]
  workflow_dispatch:
  
# Add permissions block to allow upload to releases
permissions:
  contents: write

env:
  OPENMS_VERSION: 3.2.0 
  PYTHON_VERSION: 3.11.0
  # Name of the installer
  APP_NAME: UmetaFlow
  # Define needed TOPP tools here
  TOPP_TOOLS: "HighResPrecursorMassCorrector MapRTTransformer FileFilter FileConverter FeatureFinderMetabo MapAlignerPoseClustering MetaboliteAdductDecharger FeatureFinderMetaboIdent FeatureLinkerUnlabeledKD IDMapper SiriusExport GNPSExport MetaboliteSpectralMatcher"

jobs:
  build-openms:
    runs-on: windows-2022  # Pinned due to windows-2025 compatibility issues with CMake

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        repository: OpenMS/OpenMS
        ref: release/${{ env.OPENMS_VERSION }}
        path: 'OpenMS'

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: '5.15.2' # 5.12.7 is broken https://bugreports.qt.io/browse/QTBUG-81715, > 5.15.2 is not available on official archives (https://github.com/miurahr/aqtinstall/issues/636)
        host: 'windows' # default: win64_msvc2017_64
        target: 'desktop'
        install-deps: 'true'
        cache: 'false'
        aqtversion: '==3.1.*'

    # https://github.com/marketplace/actions/visual-studio-shell
    - name: Set up Visual Studio shell
      uses: egor-tensin/vs-shell@v2
      with:
        arch: x64

    - name: Setup build tools
      shell: bash
      run: |
        choco install ccache ninja -y --no-progress
        choco install cmake --version=3.31.1 -y --no-progress --force
        ## GH CLI "SHOULD BE" installed. Sometimes I had to manually install nonetheless. Super weird.
        # https://github.com/actions/runner-images/blob/main/images/win/scripts/Installers/Install-GitHub-CLI.ps1
        echo "C:/Program Files (x86)/GitHub CLI" >> $GITHUB_PATH

    - name: Extract branch/PR infos
      shell: bash
      run: |
        cd OpenMS
        RUN_NAME_LOCAL=$(echo ${GITHUB_REF#refs/heads/} | tr / -)
        echo "RUN_NAME=${RUN_NAME_LOCAL}" >> $GITHUB_ENV
        echo "BASE_REF=$(gh pr view --json baseRefName -q .baseRefName || echo ${RUN_NAME_LOCAL})" >> $GITHUB_ENV
      id: extract_branch
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Cache contrib
      id: cache-contrib-win
      uses: actions/cache@v4
      with:
        path: ${{ github.workspace }}/OpenMS/contrib
        key: ${{ runner.os }}-contrib-${{ env.OPENMS_VERSION }}

    - name: Load contrib build
      if: steps.cache-contrib-win.outputs.cache-hit != 'true'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        cd OpenMS/contrib
        # Download the contrib release that matches the OpenMS release built here. The
        # latest contrib release is a build for OpenMS develop and does not fit it.
        gh release download release/${{ env.OPENMS_VERSION }} -R OpenMS/contrib --pattern 'contrib_build-Windows.tar.gz'
        # Extract the archive
        7z x -so contrib_build-Windows.tar.gz | 7z x -si -ttar
        rm contrib_build-Windows.tar.gz
        ls

    - name: Add contrib to PATH
      shell: bash
      run: |
        # Add contrib library path for runtime DLL resolution
        echo "${{ github.workspace }}/OpenMS/contrib/lib" >> $GITHUB_PATH

    - name: Setup ccache cache
      uses: actions/cache@v4
      with:
        path: .ccache
        key: ${{ runner.os }}-ccache-${{ env.RUN_NAME }}-${{ github.run_number }}
        # Restoring: From current branch, otherwise from base branch, otherwise from any branch.
        restore-keys: |
          ${{ runner.os }}-ccache-${{ env.RUN_NAME }}
          ${{ runner.os }}-ccache-${{ env.BASE_REF }}
          ${{ runner.os }}-ccache-

    - name: Add THIRDPARTY
      shell: bash
      run: |
          # initialize THIRDPARTY
          cd OpenMS
          git submodule update --init THIRDPARTY
          cd ..
          # add third-party binaries to PATH
          # use flat THIRDPARTY structure
          mkdir -p _thirdparty
          cp -R OpenMS/THIRDPARTY/Windows/64bit/* _thirdparty/
          cp -R OpenMS/THIRDPARTY/All/* _thirdparty/
          # add third-party binaries to PATH
          for thirdpartytool in ${{ github.workspace }}/_thirdparty/*
          do
            echo $thirdpartytool >> $GITHUB_PATH
          done

    - name: Disable CDash submission
      shell: bash
      run: |
          # Comment out ctest_submit calls to prevent CDash submission failures
          # The CDash server (cdash.openms.de) is often unreachable and causes build failures
          sed -i 's/ctest_submit/#ctest_submit/g' OpenMS/tools/ci/cibuild.cmake
          sed -i 's/ctest_submit/#ctest_submit/g' OpenMS/tools/ci/citest.cmake
          sed -i 's/ctest_submit/#ctest_submit/g' OpenMS/tools/ci/cipackage.cmake

    - name: Build Windows
      shell: bash
      run: |
          mkdir $GITHUB_WORKSPACE/OpenMS/bld/
          ctest --output-on-failure -V -S $GITHUB_WORKSPACE/OpenMS/tools/ci/cibuild.cmake
      env:
          #OS_PREFIX_PATH: "${{ env.Qt5_DIR }}/lib/cmake;${{ env.Qt5_DIR }}"
          OPENMS_CONTRIB_LIBS: "${{ github.workspace }}/OpenMS/contrib"
          CI_PROVIDER: "GitHub-Actions"
          CMAKE_GENERATOR: "Ninja"
          SOURCE_DIRECTORY: "${{ github.workspace }}/OpenMS"
          BUILD_NAME: "${{ env.RUN_NAME }}-Win64-class-topp-${{ github.run_number }}"
          ENABLE_STYLE_TESTING: "OFF"
          ENABLE_TOPP_TESTING: "ON"
          ENABLE_CLASS_TESTING: "ON"
          WITH_GUI: "OFF"
          ADDRESS_SANITIZER: "Off"
          BUILD_TYPE: "Release"
          OPENMP: "Off"
          USE_STATIC_BOOST: "On"
          #  BUILD_FLAGS: "-p:CL_MPCount=2" # For VS Generator and MSBuild
          BUILD_FLAGS: "-j2" # Ninja will otherwise use all cores (doesn't go well in GHA)
          CMAKE_CCACHE_EXE: "ccache"
          CCACHE_BASEDIR: ${{ github.workspace }}
          CCACHE_DIR: ${{ github.workspace }}/.ccache
          CCACHE_COMPRESS: true
          CCACHE_COMPRESSLEVEL: 12
          CCACHE_MAXSIZE: 400M

    - name: Test Windows
      shell: bash
      run: ctest --output-on-failure -V -S $GITHUB_WORKSPACE/OpenMS/tools/ci/citest.cmake
      env:
          SOURCE_DIRECTORY: "${{ github.workspace }}/OpenMS"
          CI_PROVIDER: "GitHub-Actions"
          BUILD_NAME: "${{ env.RUN_NAME }}-Win64-class-topp-${{ github.run_number }}"

    - name: Package
      shell: bash
      run: |
          ctest --output-on-failure -V -S $GITHUB_WORKSPACE/OpenMS/tools/ci/cipackage.cmake
      env:
          SOURCE_DIRECTORY: "${{ github.workspace }}/OpenMS"
          PACKAGE_TYPE: zip
          SEARCH_ENGINES_DIRECTORY: "${{ github.workspace }}/_thirdparty"
          CI_PROVIDER: "GitHub-Actions"
          CPACK_PACKAGE_FILE_NAME: "openms-package"

    - name: Upload package as artifact
      uses: actions/upload-artifact@v4
      with:
        name: openms-package
        path: ${{ github.workspace }}/OpenMS/bld/*.zip

  build-executable:
    runs-on: windows-2022  # Pinned due to windows-2025 compatibility issues
    needs: build-openms  

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Set Version in settings.json
      run: |
        # Only release builds carry a tag; other builds keep settings.json's
        # version instead of blanking it in the app's sidebar.
        $VERSION="${{ github.event.release.tag_name }}"
        if ($VERSION) {
          $content = Get-Content -Raw settings.json | ConvertFrom-Json
          $content.version = $VERSION
          $content | ConvertTo-Json -Depth 100 | Set-Content settings.json
        }

    - name: Download package as artifact
      uses: actions/download-artifact@v4
      with:
        name: openms-package
        path: openms-package

    - name: Extract bin and share from package
      run: |
        cd openms-package
        unzip "*.zip" -d .
        cp -r openms-package/bin ../openms-bin
        cp -r openms-package/share ../share

    - name: Set up Python (regular distribution)
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }} # Use the same version as the embeddable version
    
    - name: Setup python embeddable version
      run: |
        # Create a directory for the embeddable Python version
        mkdir python-${{ env.PYTHON_VERSION }}
        
        # Download and unzip the embeddable Python version
        curl -O https://www.python.org/ftp/python/${{ env.PYTHON_VERSION }}/python-${{ env.PYTHON_VERSION }}-embed-amd64.zip
        unzip python-${{ env.PYTHON_VERSION }}-embed-amd64.zip -d python-${{ env.PYTHON_VERSION }}
        rm python-${{ env.PYTHON_VERSION }}-embed-amd64.zip

        # Define paths for the regular Python distribution and the embeddable distribution
        $PYTHON_DIR="${{ runner.tool_cache }}/Python/${{ env.PYTHON_VERSION }}/x64" # Path from actions/setup-python
        $EMBED_DIR="python-${{ env.PYTHON_VERSION }}"
        
        mkdir -p $EMBED_DIR/Lib/site-packages/tkinter
        mkdir -p $EMBED_DIR/tcl

        # Copy necessary Tkinter files from the regular Python distribution
        cp -r $PYTHON_DIR/Lib/tkinter/* $EMBED_DIR/Lib/site-packages/tkinter/
        cp -r $PYTHON_DIR/tcl/* $EMBED_DIR/tcl/
        cp $PYTHON_DIR/DLLs/_tkinter.pyd $EMBED_DIR/
        cp $PYTHON_DIR/DLLs/tcl86t.dll $EMBED_DIR/
        cp $PYTHON_DIR/DLLs/tk86t.dll $EMBED_DIR/

    - name: Install pip
      run: |
        curl -O https://bootstrap.pypa.io/get-pip.py
        ./python-${{ env.PYTHON_VERSION }}/python get-pip.py --no-warn-script-location
        rm get-pip.py

    - name: Uncomment 'import site' in python311._pth file
      run: |
        sed -i 's/#import site/import site/' python-${{ env.PYTHON_VERSION }}/python311._pth

    - name: Install Required Packages
      run: .\python-${{ env.PYTHON_VERSION }}\python -m pip install --force-reinstall -r requirements.txt --no-warn-script-location

    - name: Set to offline deployment
      run: |
        $content = Get-Content -Raw settings.json | ConvertFrom-Json
        $content.online_deployment = $false
        $content | ConvertTo-Json -Depth 100 | Set-Content settings.json

    - name: Create All-in-one executable folder
      run: |
        mkdir streamlit_exe

        mv python-${{ env.PYTHON_VERSION }} streamlit_exe
        cp -r src streamlit_exe
        cp -r content streamlit_exe
        cp -r assets streamlit_exe
        cp -r example-data streamlit_exe
        cp openms-bin/*.dll streamlit_exe
        cp -r .streamlit streamlit_exe
        cp -r share streamlit_exe/share
        cp app.py streamlit_exe
        cp settings.json streamlit_exe
        cp default-parameters.json streamlit_exe
        # Parameter presets of the workflows; without it the preset buttons are missing.
        if (Test-Path presets.json) { cp presets.json streamlit_exe }

        $files = $env:TOPP_TOOLS -split ' '
        foreach ($file in $files) {
          Copy-Item "openms-bin/${file}.exe" -Destination "streamlit_exe/${file}.exe"
        }

    - name: Set up Node.js for the Electron installer
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: electron/package-lock.json

    - name: Build Electron installer
      # Wraps the folder in the Electron shell (electron/) as a per-user NSIS
      # installer that needs no admin rights.
      run: |
        Copy-Item -Recurse streamlit_exe electron/payload
        # electron-builder needs a semver version; take the numeric part of the release tag.
        $version = "1.0.0"
        if ("${{ github.event.release.tag_name }}" -match '(\d+)(?:\.(\d+))?(?:\.(\d+))?') {
          $version = "$($Matches[1]).$(if ($Matches[2]) { $Matches[2] } else { 0 }).$(if ($Matches[3]) { $Matches[3] } else { 0 })"
        }
        cd electron
        npm ci
        npx electron-builder --win nsis --publish never `
          "-c.productName=${{ env.APP_NAME }}" `
          "-c.appId=de.openms.${{ env.APP_NAME }}" `
          "-c.extraMetadata.productName=${{ env.APP_NAME }}" `
          "-c.extraMetadata.version=$version" `
          ('-c.nsis.artifactName=${{ env.APP_NAME }}-Setup.${ext}')

    - name: Smoke test Electron installer
      # Installs silently, then checks pyOpenMS, every TOPP tool and the
      # Streamlit server with the shell's environment, and finally launches the
      # installed app, which exits 0 once the page has created a workspace.
      run: |
        Start-Process -FilePath "electron/dist/${{ env.APP_NAME }}-Setup.exe" -ArgumentList "/S" -Wait
        $inst = Join-Path $env:LOCALAPPDATA "Programs/${{ env.APP_NAME }}"
        node electron/scripts/smoke-payload.js "$inst/resources/app-payload" @($env:TOPP_TOOLS -split ' ')
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

        $env:OPENMS_APP_SMOKE_TEST = "1"
        $app = Start-Process -FilePath "$inst/${{ env.APP_NAME }}.exe" -PassThru
        if (-not $app.WaitForExit(300000)) { Stop-Process -Id $app.Id -Force; throw "Electron app did not finish its smoke test" }
        $log = Join-Path $env:APPDATA "${{ env.APP_NAME }}/logs/streamlit.log"
        if (Test-Path $log) { Get-Content $log }
        if ($app.ExitCode -ne 0) { throw "Electron app smoke test failed with exit code $($app.ExitCode)" }

    - name: End-to-end test in the Electron window
      # Drives the installed app with Playwright and opens every page, then runs this app's
      # workflows and checks their results (tests/e2e/electron-workflows.js).
      run: |
        $inst = Join-Path $env:LOCALAPPDATA "Programs/${{ env.APP_NAME }}"
        node electron/scripts/e2e.js --exe "$inst/${{ env.APP_NAME }}.exe" --out e2e-output --scenario tests/e2e/electron-workflows.js
        $code = $LASTEXITCODE
        $log = Join-Path $env:APPDATA "${{ env.APP_NAME }}/logs/streamlit.log"
        if (Test-Path $log) { Get-Content $log -Tail 200 }
        exit $code

    - name: Archive end-to-end screenshots
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: electron-e2e-screenshots
        path: e2e-output
        if-no-files-found: ignore

    - name: Archive Electron installer
      uses: actions/upload-artifact@v4
      with:
        name: OpenMS-App-Electron
        path: electron/dist/${{ env.APP_NAME }}-Setup.exe

    - name: Upload Artifact as Release Asset
      if: github.event_name == 'release'
      uses: softprops/action-gh-release@v2
      with:
        files: |
          electron/dist/${{ env.APP_NAME }}-Setup.exe
        token: ${{ github.token }}
