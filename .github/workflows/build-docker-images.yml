name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build-full-app:

    runs-on: ubuntu-latest

    steps:
    - name: Free disk space
      # The image installs torch and the other ms2query dependencies; the
      # hosted runner's free disk is not enough for that without this.
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
        # Exporting the full image (OpenMS built from source) still ran out
        # of disk with only the line above, so take the remaining toolchains
        # and the runner's cached docker images too (as the template's
        # build-and-test.yml does).
        sudo rm -rf /opt/hostedtoolcache /usr/local/.ghcup /usr/share/swift \
          /usr/local/share/powershell /usr/local/share/chromium /usr/local/share/boost \
          /opt/az /opt/microsoft /opt/google /usr/lib/jvm || true
        docker system prune -af >/dev/null 2>&1 || true
        sudo apt-get clean
        df -h
    - uses: actions/checkout@v3
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    - name: Build the full Docker image
      # Built with buildx and not loaded into the runner's docker: exporting
      # the full image into the local image store took the runner down
      # ("received a shutdown signal") with 100+ GB of disk still free, and
      # this check only needs the build to succeed. The template's
      # build-image.yml builds the same Dockerfile with buildx too.
      uses: docker/build-push-action@v5
      with:
        context: .
        file: Dockerfile
        push: false
        tags: streamlitapp:latest

  build-simple-app:

    runs-on: ubuntu-latest

    steps:
    - name: Free disk space
      # The image installs torch and the other ms2query dependencies; the
      # hosted runner's free disk is not enough for that without this.
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
        # Exporting the full image (OpenMS built from source) still ran out
        # of disk with only the line above, so take the remaining toolchains
        # and the runner's cached docker images too (as the template's
        # build-and-test.yml does).
        sudo rm -rf /opt/hostedtoolcache /usr/local/.ghcup /usr/share/swift \
          /usr/local/share/powershell /usr/local/share/chromium /usr/local/share/boost \
          /opt/az /opt/microsoft /opt/google /usr/lib/jvm || true
        docker system prune -af >/dev/null 2>&1 || true
        sudo apt-get clean
        df -h
    - uses: actions/checkout@v3
    - name: Build the Docker image (pyOpenMS only)
      run: docker build . --file Dockerfile_simple --tag streamlitapp-simple:latest