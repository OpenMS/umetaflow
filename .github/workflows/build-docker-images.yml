name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build-full-app:

    runs-on: ubuntu-latest

    steps:
    - name: Free disk space
      # The full image builds OpenMS from source and ships torch, which fills
      # the runner's disk: the runner died while exporting the image layers.
      # Same step as streamlit-template's build-image.yml; this job needs no
      # tool cache, so /opt/hostedtoolcache goes too.
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache || true
        sudo apt-get clean
        df -h
    - uses: actions/checkout@v3
    - name: Build the full Docker image
      run: docker build . --file Dockerfile --tag streamlitapp:latest

  build-simple-app:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - name: Build the Docker image (pyOpenMS only)
      run: docker build . --file Dockerfile_simple --tag streamlitapp-simple:latest