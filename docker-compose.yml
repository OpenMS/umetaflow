services:
  umetaflow-app:
    build:
      context: .
      dockerfile: Dockerfile
      # Optional: GITHUB_TOKEN in the environment lets the build bundle the
      # latest release's Windows installer. It is passed as a build secret,
      # so it is not stored in the image.
      secrets:
        - github_token
    image: umetaflow_app
    container_name: umetaflow-app
    restart: always
    ports:
      - 8501:8501
      # The sync service below shares this container's network, so its port
      # is published here: on loopback only, for the host's TLS proxy to route
      # /sync to. Plain HTTP would carry sync tokens and files in the clear.
      - 127.0.0.1:8502:8502
    volumes:
      - workspaces-umetaflow-gui:/workspaces-streamlit-template
      # Optional: bind-mount a host directory of MS data files at the path
      # that `local_data_dir` in settings.json points to (the Docker image
      # defaults this to /mounted-data). When the directory exists at
      # runtime, the upload page shows an in-app file browser for it.
      # - /path/on/host:/mounted-data:ro
    environment:
      # Number of Streamlit server instances (default: 1 = no load balancer).
      # Set to >1 to enable nginx load balancing across multiple Streamlit instances.
      - STREAMLIT_SERVER_COUNT=1
      # The sync service below; with STREAMLIT_SERVER_COUNT > 1 the bundled
      # nginx proxies /sync/ to it.
      - SYNC_UPSTREAM=127.0.0.1:8502
      # With the data mount above, name its host folder so the upload page
      # can show users where to put their files:
      # - LOCAL_DATA_HOST_DIR=/path/on/host
  # Workspace sync service for the desktop app (workspace_sync in
  # settings.json), in its own container so large transfers neither compete
  # with the app nor break when it restarts. Same image, same workspaces
  # volume. Put it behind the same reverse proxy as the app at /sync/, or set
  # workspace_sync.public_url to wherever it is reachable. It shares the app
  # container's network namespace to reach the Redis queue that container
  # runs on localhost: the desktop app starts workflow runs through it.
  sync:
    image: umetaflow_app
    container_name: umetaflow-app-sync
    restart: always
    depends_on:
      - umetaflow-app
    entrypoint: ["/bin/bash", "-c", "source /root/miniforge3/bin/activate streamlit-env && exec python -m src.sync.server --port 8502"]
    network_mode: "service:umetaflow-app"
    environment:
      - REDIS_URL=redis://localhost:6379/0
    volumes:
      - workspaces-umetaflow-gui:/workspaces-streamlit-template
secrets:
  github_token:
    environment: GITHUB_TOKEN

volumes:
  # Kept under its earlier name, so an upgraded installation keeps its
  # workspaces; only the mount point inside the container changed.
  workspaces-umetaflow-gui:
